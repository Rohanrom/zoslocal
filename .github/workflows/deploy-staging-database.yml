name: Deploy Staging Database

on:
  push:
    branches:
      - development
    paths:
      - "supabase/migrations/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zos-staging-database
  cancel-in-progress: false

jobs:
  migrate:
    name: staging-db-migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push --yes

      - name: Show migration status
        run: supabase migration list